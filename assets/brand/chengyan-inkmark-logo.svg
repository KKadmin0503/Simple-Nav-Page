  <path d="M49 89c4.2-2.3 9.4-3.5 15.4-3.5 5.7 0 10.5 1.1 14.6 3.5" fill="none" stroke="#80D8C9" stroke-opacity="0.46" stroke-width="2.6" stroke-linecap="round"/>

