<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">澄砚导航 Logo</title>
  <desc id="desc">An ink drop navigation mark with clear water ripples and a quiet compass needle.</desc>
