      <stop offset="0" stop-color="#344153"/>
      <stop offset="0.56" stop-color="#111923"/>
      <stop offset="1" stop-color="#05080D"/>
    </radialGradient>
    <linearGradient id="water" x1="25" y1="49" x2="105" y2="72" gradientUnits="userSpaceOnUse">
