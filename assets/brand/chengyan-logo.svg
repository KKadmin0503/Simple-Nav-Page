<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">澄砚导航 Logo</title>
  <desc id="desc">A rounded navigation mark with an inkstone base and green compass needle.</desc>
  <defs>
    <linearGradient id="bg" x1="18" y1="10" x2="106" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#142032"/>
      <stop offset="1" stop-color="#061016"/>
    </linearGradient>
    <linearGradient id="needle" x1="34" y1="94" x2="93" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3F9D52"/>
      <stop offset="1" stop-color="#B4F5C7"/>
    </linearGradient>
    <linearGradient id="stone" x1="28" y1="72" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C2B34"/>
      <stop offset="1" stop-color="#0A151A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <path d="M31 83c5-14 19-23 37-23 18 0 32 9 37 23 2 7-3 15-10 15H41c-8 0-13-8-10-15Z" fill="url(#stone)" stroke="#FFFFFF29" stroke-width="2" filter="url(#softShadow)"/>
  <path d="M42 85c4-8 14-13 26-13s22 5 26 13" fill="none" stroke="#63C174" stroke-width="5" stroke-linecap="round" opacity="0.86"/>
  <path d="M82 30 69 77 34 96 49 60 82 30Z" fill="url(#needle)" filter="url(#softShadow)"/>
  <path d="M82 30 69 77 96 54 82 30Z" fill="#F5FFF6" opacity="0.92"/>
  <circle cx="68" cy="76" r="8" fill="#081219" stroke="#B4F5C7" stroke-width="4"/>
  <path d="M68 27v10M68 101v8M27 68h10M101 68h8" stroke="#FFFFFFCC" stroke-width="5" stroke-linecap="round" opacity="0.78"/>
